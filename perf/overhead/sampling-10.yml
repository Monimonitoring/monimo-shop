# 측정 변형 : 앱 쪽 트레이스 샘플링만 켠다 (지금 always_on → 10%). 다른 것은 그대로다 (#51)
#
# 어느 샘플링인가 : 에이전트가 "보낼지 말지" 정하는 쪽이다. Collector 쪽 비율
#   (application_configs.sampling_rate, backend #121 · #206)은 받은 뒤에 버리는 것이라
#   앱 부담과 아무 상관이 없고 이 변형이 건드리지 않는다
#
# 운영 계획과 다르다 : 운영의 shop 1% 는 Collector 쪽 값이고 에이전트는 always_on 으로 둔다
#   (backend ADR #72). 그래서 이 변형은 운영 설정을 흉내 내는 것이 아니라
#   "앱 쪽에서 샘플링을 내리면 앱 부담이 주는가" 를 재는 실험이다
#
# 기대 : 앱 CPU 는 거의 안 준다. 계측이 샘플링 결정보다 먼저 돌아 스팬을 이미 만들기 때문이다
#   (#36 파일럿에서 10% 로 내려도 CPU 가 거의 안 줄었다). 줄어드는 자리는 큐 · 전송과 Collector 이후다.
#   #36 은 CPU 만 봤으므로 이번에는 메모리 쪽도 본다
#
# parentbased_traceidratio 를 쓴다 : 루트(gateway)에서만 비율로 정하고 아래 서비스는 들어온
#   traceparent 의 결정을 따른다. 그래서 네 서비스에 같은 값을 넣어도 트레이스가 쪼개지지 않는다
x-env: &env
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
services:
  gateway:   {environment: *env}
  order:     {environment: *env}
  payment:   {environment: *env}
  inventory: {environment: *env}
