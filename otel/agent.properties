# OTel Java Agent 설정 (쇼핑몰 4개 서비스 공통). 루트 Dockerfile(서비스 공통 base 단계)이 이 파일을 -Dotel.javaagent.configuration-file= 로 읽는다.
# 에이전트 버전은 AGENT_VERSION 에 고정한다. 여기서 정한 값은 같은 이름의 환경변수(OTEL_*)로 덮어쓸 수 있다.
# 서비스 이름(otel.service.name)은 여기 적지 않는다. 컨테이너마다 OTEL_SERVICE_NAME 으로 넣는다 (shop-gateway · shop-order · shop-payment · shop-inventory).

# 전송: OTLP gRPC → Collector(monimo-backend collector). 컨테이너끼리 collector:4317 (개발환경 6단계 연결 약속, 공용 네트워크 monimo-dev)
# 내 컴퓨터에서 직접 실행할 때는 OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 로 덮어쓴다.
otel.exporter.otlp.protocol=grpc
otel.exporter.otlp.endpoint=http://collector:4317
# Collector 가 TLS 를 켜면(backend #159) 주소를 https:// 로 바꾸고 파일 셋을 준다 : otel.exporter.otlp.certificate(기관 인증서) ·
# otel.exporter.otlp.client.certificate(손님 신분증) · otel.exporter.otlp.client.key(손님 열쇠, PKCS8 PEM).
# 셋은 여기 적지 않는다 : 신분증이 서비스마다 다른데 이 파일은 네 서비스가 같이 쓴다 (이름표를 여기 안 적는 것과 같은 이유, #30).
# compose 가 MONIMO_OTLP_CERTS_DIR 이 차 있을 때만 env_file(backend certs/env/shop-<서비스>.env)로 서비스마다 넣는다.
# 환경변수를 빈 값으로 넣으면 에이전트가 "Invalid OTLP certificate/key path" 로 멈춘다(실측). 그래서 켤 때만 파일째 넣는다

# 3신호 전부 OTLP 로 보낸다
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp

# 샘플링은 에이전트가 하지 않는다. 100% 보내고 Collector 가 trace ID 해시로 고른다 (ADR #33)
otel.traces.sampler=always_on

# 감시 대상 앱이 **HTTP 로 말하는 DB** 를 쓰면 아래 한 줄이 필요하다 (#54 · backend #259). 지금 쇼핑몰은 필요 없다 :
# MySQL · Redis · Kafka 는 전용 프로토콜이고 pg-stub 은 진짜 외부 HTTP 호출이라 그렇게 보여야 맞다.
#otel.instrumentation.experimental.span-suppression-strategy=span-kind
#
# 왜 필요한가 : ClickHouse 처럼 HTTP 로 말하는 DB 는 드라이버가 HTTP 라이브러리를 거친다. 계측 모듈을 두 번 지나서
# 조회 한 번에 CLIENT 스팬이 둘 생긴다 (부모는 db.system 이 있어 DB · 자식은 없어서 EXTERNAL).
# 그러면 Service map 이 그 앱의 호출 수를 2배로 세고 가짜 EXTERNAL 노드까지 만든다.
# span-kind 는 겉 스팬과 **같은 종류**의 안쪽 스팬을 안 만든다. 겉에 있는 CLIENT 는 남으므로 진짜 외부 HTTP 호출 간선은 안 사라진다.
# 실측(backend #259, 2026-10-28) : 같은 1분에 DB 32 · EXTERNAL 32 → DB 24 · EXTERNAL 0.
# 잃는 것은 그 DB 호출의 HTTP 응답 코드와 url.full 이고, 걸린 시간은 부모 DB 스팬이 그대로 갖고 있다.
#
# **우리가 남의 앱에 넣어 줄 수는 없다** : 이건 그 앱의 환경변수 · 설정 파일이라 앱 주인이 넣어야 한다.
# 전용 포트로 바꾸는 쪽은 안 통했다 : clickhouse-java 0.10.0 은 전용 포트에도 HTTP 로 말을 건다(실측)

# 로컬에서 화면에 빨리 보이게 지표 · 로그 전송 주기를 줄인다 (기본 60초 · 1초)
otel.metric.export.interval=10000

# 환경 표시. 배포 환경에서는 OTEL_RESOURCE_ATTRIBUTES 로 덮어쓴다.
# 환경변수는 이 줄을 합치지 않고 통째로 바꾼다. 그래서 compose · K8s 에서 이름표(service.instance.id)를 줄 때 이 값도 같이 적는다(#30)
# 이름표는 여기 적지 않는다 : 네 서비스 · 모든 파드가 이 파일을 똑같이 쓰므로 파드마다 다른 값을 넣을 수 없다
otel.resource.attributes=deployment.environment.name=local
