# 라이브러리 버전은 이 파일 한 곳에서만 정한다. 모듈의 build.gradle.kts 에는 버전을 쓰지 않는다.
# 버전은 monimo-backend/gradle/libs.versions.toml 과 맞춘다 (두 레포를 같은 사람이 오가므로 규칙을 하나로).

[versions]
java = "17"
kotlin = "2.2.21"
spring-boot = "3.5.16"
kotest = "6.2.5"
# agent-extension 이 컴파일할 때만 쓰는 OTel API. 실행 때는 에이전트(otel/AGENT_VERSION = 2.31.1)가 가지고 있다
# 2.31.1 에이전트가 쓰는 SDK 가 1.65.0 이다 (opentelemetry-java-instrumentation v2.31.1 examples/extension)
otel-sdk = "1.65.0"
otel-javaagent = "2.31.1-alpha"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
# 테스트는 Kotest (ADR #48). JUnit Platform 위에서 돈다.
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# 주문 서비스 DB (MySQL + JDBC — Service map 에 DB 노드가 나오게, Notion 「사용할 라이브러리 정리」 §3). 버전은 Spring Boot BOM 이 정한다
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
# 테스트에서 진짜 MySQL 을 컨테이너로 띄운다 (Testcontainers)
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql" }
# 재고 서비스 캐시 (Redis, 클라이언트는 Boot 기본인 Lettuce). Service map 에 캐시 노드가 나오게 (#32). 버전은 Spring Boot BOM 이 정한다
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }

# agent-extension (compileOnly). 실행 때는 에이전트 안의 같은 클래스를 쓴다
otel-javaagent-extension-api = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent-extension-api", version.ref = "otel-javaagent" }
otel-sdk-extension-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure", version.ref = "otel-sdk" }
otel-sdk-extension-autoconfigure-spi = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi", version.ref = "otel-sdk" }
otel-sdk-common = { module = "io.opentelemetry:opentelemetry-sdk-common", version.ref = "otel-sdk" }
otel-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "otel-sdk" }

[bundles]
# 쇼핑몰 서비스 4개가 공통으로 쓰는 것. 동기 Spring MVC 만 쓴다 (WebFlux 는 MVP 범위 밖, ADR #33).
service-base = ["spring-boot-starter-web", "spring-boot-starter-actuator", "jackson-module-kotlin", "kotlin-reflect"]
service-test = ["spring-boot-starter-test", "kotest-runner-junit5", "kotest-assertions-core", "kotest-extensions-spring"]
# 스프링이 없는 모듈(agent-extension)용
kotest = ["kotest-runner-junit5", "kotest-assertions-core"]
# agent-extension 이 컴파일할 때만 쓰는 OTel API (compileOnly · 테스트)
otel-extension = ["otel-javaagent-extension-api", "otel-sdk-extension-autoconfigure", "otel-sdk-extension-autoconfigure-spi", "otel-sdk-common", "otel-api"]
# MySQL 쓰는 모듈(order)
mysql = ["spring-boot-starter-jdbc", "mysql-connector-j"]
mysql-test = ["spring-boot-testcontainers", "testcontainers-mysql"]
# Redis 캐시 쓰는 모듈(inventory). @Cacheable 은 starter-cache, Redis 연결은 starter-data-redis
redis-cache = ["spring-boot-starter-data-redis", "spring-boot-starter-cache"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
