# 쇼핑몰 로컬 실행: MySQL + Redis + 더미 외부 결제사(pg-stub) + 결제 + 재고 + 주문 + 게이트웨이(입구).
#
#   docker network create monimo-dev                              # 처음 한 번만 (backend 와 같이 쓰는 공용 네트워크)
#   docker compose -f docker-compose.dev.yml up -d --build --wait  # 켜기 (일곱 다 healthy 가 될 때까지 기다림)
#   docker compose -f docker-compose.dev.yml down                  # 끄기 (주문 · 재고 데이터는 볼륨에 남음, 지우려면 down -v)
#
# 값은 .env 로 바꾼다 (.env.example 참고). 비워 두면 아래 ${이름:-기본값} 의 기본값을 쓴다.
# 에이전트는 이미지에 들어 있어 collector:4317 로 보낸다. Collector 는 monimo-backend 에서 --profile collector 로 켠다.
# Collector 가 꺼져 있어도 쇼핑몰은 정상으로 뜬다 (에이전트는 전송 실패를 로그로만 남긴다).
name: monimo-shop

# 공용 네트워크 monimo-dev (개발환경 6단계 연결 약속). backend compose 가 같은 이름으로 쓴다.
networks:
  default:
    name: monimo-dev
    external: true

services:
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      # 로컬 전용. 운영 비밀값이 아니다
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - shop-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 재고 조회 캐시. 7.2 는 BSD 라이선스의 마지막 줄 (7.4 부터 RSAL/SSPL). 데이터는 남기지 않는다 (캐시라 잃어도 MySQL 에서 다시 채운다)
  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # 더미 외부 결제사. 진짜 외부 시스템처럼 에이전트를 붙이지 않는다 (Service map 에서 "밖으로 나가는 호출" 노드로 보이게).
  # 응답 정의는 pg-stub/mappings/ 의 JSON (pg-stub/README.md)
  pg-stub:
    image: wiremock/wiremock:3.13.2
    ports:
      - "${PG_STUB_PORT:-8099}:8080"
    volumes:
      - ./pg-stub/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      target: payment   # 루트 Dockerfile 하나에서 이 서비스 단계만 (#42)
    image: monimo/shop-payment:dev
    ports:
      - "${PAYMENT_PORT:-8092}:8092"
    environment:
      # Collector 주소는 agent.properties 의 http://collector:4317 이다. 여기 OTEL_EXPORTER_OTLP_ENDPOINT 를 두지 않는다 (아래 env_file 설명)
      # PG_BASE_URL=http://pg-stub:8080 은 이미지 기본값이라 적지 않는다 (서비스 이름과 같다)
      # 에이전트 이름표(service.instance.id). 안 주면 에이전트가 뜰 때마다 랜덤 UUID 를 만들어 재시작할 때마다 새 에이전트처럼 보인다(#30).
      # 백엔드는 이 값을 agent_id 로 쓴다. K8s 에서는 Downward API 로 파드 이름을 넣고(README), compose 엔 파드가 없어 이름을 직접 적는다.
      # agent.properties 의 같은 키를 통째로 덮으므로 deployment.environment.name=local 도 같이 적는다
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=shop-payment-local-1,deployment.environment.name=local"
      # 스레드 덤프 Extension 이 Collector(collector:8081, OTLP 4317 이 아니라 HTTP 쪽)에 명령을 받으러 갈 때 붙이는 토큰 (#34).
      # Collector 의 MONIMO_AGENT_TOKEN 과 같아야 한다. 로컬 전용 값이다. :- 라서 .env 에 빈 값을 넣어도 기본값이 되살아난다
      # (Extension 은 토큰이 비면 꺼지지만, 끄려면 이 줄을 직접 비워야 한다)
      OTEL_MONIMO_AGENT_TOKEN: ${MONIMO_AGENT_TOKEN:-local-agent-token}
    # 에이전트 mTLS (backend #159 · ADR #64). .env 의 MONIMO_OTLP_CERTS_DIR 이 비어 있으면(기본) 없는 파일을 가리켜 아무것도 안 읽고
    # 지금처럼 평문(agent.properties 의 http://collector:4317)이다. 채우면 그 폴더(backend compose 가 monimo-backend/certs 에 만든다)의
    # env/shop-payment.env 를 읽어 https 주소와 파일 셋(기관 인증서 · 이 서비스의 신분증 · 열쇠)을 받고, 폴더를 /certs 로 읽는다.
    # environment 가 아니라 env_file 인 이유 : 환경변수를 빈 값으로 넣으면 에이전트가 "Invalid OTLP certificate/key path" 로 멈춘다(실측).
    # 그래서 OTEL_EXPORTER_OTLP_ENDPOINT 도 environment 에 두지 않는다 (null 항목이 env_file 값을 덮는다, 실측)
    env_file:
      - path: ${MONIMO_OTLP_CERTS_DIR:-./otel/mtls-off}/env/shop-payment.env
        required: false
    volumes:
      - ${MONIMO_OTLP_CERTS_DIR:-./otel}:/certs:ro
    depends_on:
      pg-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8092/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      # 에이전트가 계측 코드를 심느라 기동이 몇 초 느려진다
      start_period: 30s

  inventory:
    build:
      context: .
      dockerfile: Dockerfile
      target: inventory
    image: monimo/shop-inventory:dev
    ports:
      - "${INVENTORY_PORT:-8093}:8093"
    environment:
      # MYSQL_HOST=mysql · REDIS_HOST=redis 는 이미지 기본값이라 적지 않는다 (서비스 이름과 같다)
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      # 에이전트 이름표. 재시작해도 그대로 (payment 설명 참고, #30)
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=shop-inventory-local-1,deployment.environment.name=local"
      OTEL_MONIMO_AGENT_TOKEN: ${MONIMO_AGENT_TOKEN:-local-agent-token}   # 스레드 덤프 Extension (payment 설명 참고)
      # Redis 는 peer 매핑에 넣지 않는다. 넣으면 Service map 이 Redis 를 DB 가 아니라 우리 서비스로 잘못 그린다 (#32)
    # 에이전트 mTLS (backend #159 · ADR #64). .env 의 MONIMO_OTLP_CERTS_DIR 이 비어 있으면(기본) 없는 파일을 가리켜 아무것도 안 읽고
    # 지금처럼 평문(agent.properties 의 http://collector:4317)이다. 채우면 그 폴더(backend compose 가 monimo-backend/certs 에 만든다)의
    # env/shop-inventory.env 를 읽어 https 주소와 파일 셋(기관 인증서 · 이 서비스의 신분증 · 열쇠)을 받고, 폴더를 /certs 로 읽는다.
    # environment 가 아니라 env_file 인 이유 : 환경변수를 빈 값으로 넣으면 에이전트가 "Invalid OTLP certificate/key path" 로 멈춘다(실측).
    # 그래서 OTEL_EXPORTER_OTLP_ENDPOINT 도 environment 에 두지 않는다 (null 항목이 env_file 값을 덮는다, 실측)
    env_file:
      - path: ${MONIMO_OTLP_CERTS_DIR:-./otel/mtls-off}/env/shop-inventory.env
        required: false
    volumes:
      - ${MONIMO_OTLP_CERTS_DIR:-./otel}:/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8093/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  order:
    build:
      context: .
      dockerfile: Dockerfile
      target: order
    image: monimo/shop-order:dev
    ports:
      - "${ORDER_PORT:-8091}:8091"
    environment:
      # MYSQL_HOST=mysql · INVENTORY_BASE_URL=http://inventory:8093 · PAYMENT_BASE_URL=http://payment:8092 는 이미지 기본값이라 적지 않는다
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop}
      # 에이전트 이름표. 재시작해도 그대로 (payment 설명 참고, #30)
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=shop-order-local-1,deployment.environment.name=local"
      OTEL_MONIMO_AGENT_TOKEN: ${MONIMO_AGENT_TOKEN:-local-agent-token}   # 스레드 덤프 Extension (payment 설명 참고)
      # Service map 에서 order → payment 를 "우리 서비스" 로 잇는다. 에이전트는 상대 서비스 이름(peer.service)을 비워 보내는데,
      # 비어 있으면 Service map 집계가 주소(payment:8092)를 외부 시스템으로 분류한다(Q20). 호스트 이름이 환경마다 달라 agent.properties 가 아니라 여기 둔다.
      # pg-stub 은 외부 결제사라 일부러 넣지 않는다. Redis · MySQL 도 넣지 않는다 (DB 는 db.system 으로 가려진다)
      OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING: "payment=shop-payment,inventory=shop-inventory"
    # 에이전트 mTLS (backend #159 · ADR #64). .env 의 MONIMO_OTLP_CERTS_DIR 이 비어 있으면(기본) 없는 파일을 가리켜 아무것도 안 읽고
    # 지금처럼 평문(agent.properties 의 http://collector:4317)이다. 채우면 그 폴더(backend compose 가 monimo-backend/certs 에 만든다)의
    # env/shop-order.env 를 읽어 https 주소와 파일 셋(기관 인증서 · 이 서비스의 신분증 · 열쇠)을 받고, 폴더를 /certs 로 읽는다.
    # environment 가 아니라 env_file 인 이유 : 환경변수를 빈 값으로 넣으면 에이전트가 "Invalid OTLP certificate/key path" 로 멈춘다(실측).
    # 그래서 OTEL_EXPORTER_OTLP_ENDPOINT 도 environment 에 두지 않는다 (null 항목이 env_file 값을 덮는다, 실측)
    env_file:
      - path: ${MONIMO_OTLP_CERTS_DIR:-./otel/mtls-off}/env/shop-order.env
        required: false
    volumes:
      - ${MONIMO_OTLP_CERTS_DIR:-./otel}:/certs:ro
    depends_on:
      # 주문은 뜰 때 schema.sql 을 실행하고, 실패하면 기동을 멈춘다(continue-on-error=false). 그래서 MySQL 이 준비된 뒤에 띄운다
      mysql:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8091/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 입구. 손님(k6 · Watchdog 카나리)은 여기(8090)로 들어온다. /api/orders 는 주문, /api/stock 은 재고 서비스로 그대로 넘기기만 한다
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: monimo/shop-gateway:dev
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    environment:
      # ORDER_BASE_URL=http://order:8091 · INVENTORY_BASE_URL=http://inventory:8093 은 이미지 기본값이라 적지 않는다
      # 에이전트 이름표. 재시작해도 그대로 (payment 설명 참고, #30)
      OTEL_RESOURCE_ATTRIBUTES: "service.instance.id=shop-gateway-local-1,deployment.environment.name=local"
      OTEL_MONIMO_AGENT_TOKEN: ${MONIMO_AGENT_TOKEN:-local-agent-token}   # 스레드 덤프 Extension (payment 설명 참고)
      # gateway → order · inventory 를 Service map 에서 우리 서비스로 잇는다 (없으면 order:8091 이 외부로 잡힌다)
      OTEL_INSTRUMENTATION_COMMON_PEER_SERVICE_MAPPING: "order=shop-order,inventory=shop-inventory"
    # 에이전트 mTLS (backend #159 · ADR #64). .env 의 MONIMO_OTLP_CERTS_DIR 이 비어 있으면(기본) 없는 파일을 가리켜 아무것도 안 읽고
    # 지금처럼 평문(agent.properties 의 http://collector:4317)이다. 채우면 그 폴더(backend compose 가 monimo-backend/certs 에 만든다)의
    # env/shop-gateway.env 를 읽어 https 주소와 파일 셋(기관 인증서 · 이 서비스의 신분증 · 열쇠)을 받고, 폴더를 /certs 로 읽는다.
    # environment 가 아니라 env_file 인 이유 : 환경변수를 빈 값으로 넣으면 에이전트가 "Invalid OTLP certificate/key path" 로 멈춘다(실측).
    # 그래서 OTEL_EXPORTER_OTLP_ENDPOINT 도 environment 에 두지 않는다 (null 항목이 env_file 값을 덮는다, 실측)
    env_file:
      - path: ${MONIMO_OTLP_CERTS_DIR:-./otel/mtls-off}/env/shop-gateway.env
        required: false
    volumes:
      - ${MONIMO_OTLP_CERTS_DIR:-./otel}:/certs:ro
    depends_on:
      order:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  shop-mysql-data:
